<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CX Impact · Карта опыта</title>
<style>
:root{--paper:#f5f4ef;--ink:#203a34;--muted:#6c7871;--line:#dce1d9;--teal:#24695a;--mint:#e6efe7;--amber:#9b601d;--red:#a04c3d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ce9944;outline-offset:4px}button:disabled{cursor:default;opacity:.4}.shell{max-width:1920px;padding:0 34px;margin:auto}.masthead{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:750;letter-spacing:.07em}.mark{width:30px;height:30px;border:1px solid var(--teal);border-radius:50%;position:relative}.mark:before,.mark:after{content:"";position:absolute;border:1px solid var(--teal);border-radius:50%;width:15px;height:15px;top:6px;left:3px}.mark:after{left:10px}.edition{font-size:12px;color:var(--muted);letter-spacing:.06em}.header{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 0 24px;gap:36px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--teal);font-weight:700;text-transform:uppercase;margin:0 0 9px}h1{font-size:clamp(26px,2.55vw,43px);line-height:1.12;font-weight:600;letter-spacing:-.035em;margin:0}.subtitle{margin:10px 0 0;font-size:14px;color:var(--muted);max-width:740px;line-height:1.5}.actor{border-left:1px solid #bfcfc3;padding-left:20px;max-width:340px;min-width:230px;font-size:13px;line-height:1.5}.actor small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 5px}.actor p{margin:0}.actor strong{font-weight:600}.actor .goal{margin-top:7px;color:var(--muted)}.controls{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px;flex-wrap:wrap}.tabs{display:flex;gap:5px;background:#e9ece5;padding:5px;border-radius:10px}.tab{border:0;padding:10px 17px;background:transparent;border-radius:7px;font-size:13px;white-space:nowrap}.tab[aria-selected=true]{background:var(--ink);color:white;box-shadow:0 2px 4px #203a3414}.tab span{opacity:.6;font-size:10px;margin-right:9px}.tools{display:flex;gap:7px;align-items:center}.tool{border:1px solid #d1d9d0;border-radius:7px;background:#fbfcf8;padding:10px 12px;min-height:40px;font-size:12px}.tool:hover{background:#e6efe7}.tool.icon{min-width:34px;padding:8px}.scale{width:45px;text-align:center;font-size:11px;color:var(--muted)}.board{border:1px solid #d3dbd0;background:#fdfefa;border-radius:12px;box-shadow:0 6px 24px #203a3407;overflow:hidden}.boardhead{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e9df;gap:20px;font-size:12px}.boardhead strong{font-weight:600}.boardhead small{font-size:11px;color:var(--muted)}.viewport{overflow:auto;padding:14px 16px 6px;max-height:75vh;scrollbar-color:#afc2b5 #f5f6f0}.viewport svg{display:block;max-width:none;height:auto}.boardfoot{display:flex;justify-content:space-between;gap:20px;padding:12px 20px;border-top:1px solid #e4e9df;color:var(--muted);font-size:11px}.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{display:inline-flex;gap:5px;align-items:center}.dot{height:6px;width:6px;border-radius:50%;background:var(--teal)}.dot.hypothesis{background:#b47a28}.dot.proposal{background:#506caf}.dot.unknown{background:#98a19b}.footer{padding:15px 2px 20px;display:flex;justify-content:space-between;gap:24px;font-size:11px;line-height:1.5;color:var(--muted)}.footer p{margin:0;max-width:1080px}.footer .signature{white-space:nowrap;font-size:10px;letter-spacing:.07em}.drawer{position:fixed;right:18px;top:18px;bottom:18px;width:370px;max-width:calc(100vw - 36px);background:#fffef9;border:1px solid #ccd7c9;border-radius:14px;box-shadow:0 16px 80px #183b3429;z-index:20;padding:25px;overflow:auto}.drawer[hidden]{display:none}.close{float:right;background:#eef1e8;border:0;border-radius:50%;width:30px;height:30px}.drawer .eyebrow{padding-top:8px}.drawer h2{font-size:24px;line-height:1.2;font-weight:600;margin:25px 0 16px;letter-spacing:-.02em}.drawer p{font-size:14px;line-height:1.6}.drawer .badge{display:inline-block;padding:5px 9px;border-radius:5px;background:#f1ead7;color:#765c2a;font-size:11px}.detailsection{margin:25px 0 0;border-top:1px solid #e0e5da;padding-top:14px}.detailsection h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.detailsection p{font-size:12px}.status{min-height:18px;font-size:12px;color:var(--muted);margin:8px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:820px){.shell{padding:0 15px}.masthead{height:60px}.edition{display:none}.header{display:block;padding:22px 0 18px}.actor{margin-top:18px;max-width:none;min-width:0}.tabs{max-width:100%;overflow:auto}.tab{padding:10px}.tab span{display:none}.controls{gap:12px}.boardhead{display:block}.boardhead small{display:block;margin-top:6px}.boardfoot,.footer{display:block}.footer .signature{margin-top:8px}.viewport{padding:8px;max-height:70vh}.legend{gap:10px}}
@media print{.masthead,.controls,.actor,.boardhead small,.drawer,.status{display:none!important}.shell{max-width:none;padding:0}.viewport{overflow:visible;max-height:none;padding:0}.viewport svg{width:100%!important;min-width:0}.board{box-shadow:none;border:0}.header{padding:10px 0}.footer{font-size:9px}body{background:white}}

.scope{font-size:12px}.viewport:focus-visible{outline:3px solid #ce9944;outline-offset:-3px}.tools{flex-wrap:wrap}.legend-item{display:inline-flex;align-items:center;gap:6px}.legend-item svg{width:24px;height:14px}.source-kind{color:#6c7871;font-size:11px!important}.claim-block{border-top:1px solid #e0e5da;padding-top:12px;margin-top:18px}.claim-block h3{font-size:14px;margin:0 0 6px}.claim-block .badge{margin-bottom:5px}#geometry-note{padding:14px 20px;background:#f8edda;font-size:13px;line-height:1.5}#export-links{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;line-height:1.6;margin:8px 0}#export-links a{color:#24695a}#comparison-switch{display:flex;gap:8px;margin:0 0 14px}#comparison-switch[hidden]{display:none}.comparison-choice{border:1px solid #bacbbb;background:#edf3e9;border-radius:6px;padding:8px 12px}.comparison-choice[aria-pressed=true]{background:#203a34;color:white}.empty-slot{pointer-events:none}.drawer p{white-space:pre-line;overflow-wrap:anywhere}.tool,.tab{min-height:40px}.board{min-width:0}.header>div{min-width:0}
</style>
</head>
<body>
<div class="shell">
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"></span>CX IMPACT</div><div class="edition">АТЛАС ПОЛЬЗОВАТЕЛЬСКОГО ОПЫТА · 01</div></header>
<section class="header"><div><p class="eyebrow" id="map-mode"></p><div id="comparison-switch" hidden></div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><p class="subtitle scope" id="scope"></p></div><div class="actor"><small>Для кого строим карту</small><p><strong id="actor"></strong></p><p class="goal" id="goal"></p></div></section>
<nav class="controls" aria-label="Управление картой"><div class="tabs" role="tablist" aria-label="Вид карты"><button class="tab" id="tab-cjm" role="tab" data-view="cjm"><span>01</span>CJM</button><button class="tab" id="tab-blueprint" role="tab" data-view="blueprint"><span>02</span>Service blueprint</button><button class="tab" id="tab-process" role="tab" data-view="process"><span>03</span>Процесс и опыт</button></div><div class="tools"><button class="tool icon" id="minus" aria-label="Уменьшить">−</button><span class="scale" id="scale">100%</span><button class="tool icon" id="plus" aria-label="Увеличить">+</button><button class="tool" id="natural">100%</button><button class="tool" id="fit">Вписать</button><button class="tool" id="questions">Основания и вопросы</button><button class="tool" id="export">↓ SVG</button><button class="tool" id="source">↓ Исходник</button></div></nav>
<main class="board" id="map-panel" role="tabpanel" aria-labelledby="tab-cjm"><div class="boardhead"><strong id="view-title"></strong><small>Нажмите на карточку, чтобы увидеть детали и источник</small></div><div id="geometry-note" role="status" hidden></div><div class="viewport" id="viewport" tabindex="0" role="region" aria-label="Полотно карты. Прокрутка стрелками; 100 процентов для чтения, Вписать для обзора"></div><div class="boardfoot"><div class="legend" id="legend"></div><span id="stage-count"></span></div></main>
<div class="status" role="status" aria-live="polite" id="status"></div><div id="export-links"></div>
<footer class="footer"><p id="disclaimer"></p><p class="signature">CX IMPACT / VISUAL DRAFT</p></footer>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Детали карты" hidden><button class="close" id="close" aria-label="Закрыть детали">×</button><p class="eyebrow" id="detail-stage"></p><h2 id="detail-title"></h2><span class="badge" id="detail-status"></span><p id="detail-text"></p><div id="detail-related"></div><div class="detailsection"><h3>Основание</h3><div id="detail-sources"></div></div></aside>
<script id="map-data" type="application/json">/*__CX_MAP_DATA__*/</script>
<script>/*__CX_MAP_CORE__*/</script>
<script>/*__CX_MAP_VIEWER__*/</script>
</body></html>
