  --evidence:#276756;--evidence-soft:#e4eee5;--hypothesis:#87591e;--hypothesis-soft:#f5edda;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}
button,a,select{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{transition:background var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast)}
[hidden]{display:none!important}.shell{max-width:2048px;padding:0 28px;margin:auto;min-width:0}
.masthead{height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.08em}
.mark{width:27px;height:27px;position:relative;border:1.5px solid var(--fg);border-radius:4px}
.mark:before,.mark:after{content:"";position:absolute;width:13px;height:1.5px;background:var(--fg);left:5px;top:8px;transform:rotate(-35deg)}
.mark:after{top:15px;transform:rotate(35deg);background:var(--accent)}
.edition{display:none}.theme-switch{display:flex;align-items:center;gap:2px}.theme-switch button{min-height:44px;padding:8px 12px;border:0;background:transparent;color:var(--muted);font-size:12px;border-radius:4px}.theme-switch button:hover{background:var(--surface-subtle)}.theme-switch button[aria-pressed=true]{color:var(--fg);background:var(--surface-raised);box-shadow:inset 0 -2px var(--accent)}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:36px;padding:20px 0 18px}.header>div{min-width:0}

.subtitle{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55;max-width:920px}.scope{font-size:11px;margin-top:8px}
.actor{border-left:2px solid var(--border);padding-left:18px;max-width:300px;min-width:225px;font-size:12px;line-height:1.55}.actor small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.actor p{margin:0}.actor strong{font-weight:600}.actor .goal{margin-top:7px;color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);padding:10px 0}
.tabs{display:flex;gap:4px}.tab{min-height:44px;border:0;border-bottom:2px solid transparent;background:transparent;padding:10px 13px;font-size:12px;white-space:nowrap}.tab span{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-right:8px}.tab:hover{background:var(--surface-subtle)}.tab[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.tab[aria-selected=true] span{color:inherit}
.tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);min-height:44px;padding:8px 10px;font-size:12px;white-space:nowrap}.tool:hover{background:var(--surface-raised);border-color:var(--border-strong)}.tool.icon{min-width:38px;padding:8px;font-size:16px}.scale{width:41px;text-align:center;font:11px var(--font-mono);color:var(--muted)}#path-toggle{border-color:var(--accent);color:var(--accent)}#path-toggle[aria-expanded=true]{background:var(--accent-soft)}

.viewport{overflow:auto;overscroll-behavior:contain;padding:16px 16px 8px;max-height:75vh;scrollbar-color:var(--border-strong) var(--surface-subtle)}.viewport:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}.viewport svg{display:block;max-width:none;height:auto}

.footer{padding:14px 0 20px;display:flex;justify-content:space-between;gap:24px;color:var(--muted);font-size:11px;line-height:1.55}.footer p{margin:0;max-width:1080px}.signature{white-space:nowrap;font:10px var(--font-mono);letter-spacing:.04em}
.status{min-height:0;color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0}.status:empty{display:none}#export-links{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;line-height:1.6;margin:8px 0}#export-links:empty{display:none}#export-links a{color:var(--accent)}
.drawer-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:19}.drawer{position:fixed;right:16px;top:16px;bottom:16px;width:var(--drawer-w);max-width:calc(100vw - 32px);padding:24px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);z-index:20;overflow:auto}.close{float:right;background:var(--surface-subtle);border:1px solid var(--border);border-radius:4px;width:44px;height:44px;font-size:20px}.drawer .eyebrow{padding-top:12px;padding-right:50px}.drawer h2{font-family:var(--font-display);font-size:28px;line-height:1.18;font-weight:400;margin:28px 0 18px;letter-spacing:-.01em}.drawer p{font-size:14px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}.badge{display:inline-block;padding:5px 8px;border:1px solid var(--border);border-radius:2px;background:var(--surface-subtle);font-size:11px;color:var(--muted)}.detailsection{margin-top:24px;border-top:1px solid var(--border);padding-top:12px}.detailsection h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.detailsection p{font-size:12px}.source-kind{color:var(--muted);font-size:11px!important}.claim-block{border-top:1px solid var(--border);padding-top:12px;margin-top:18px}.claim-block h3{font-size:14px;margin:0 0 8px;font-weight:600}.claim-block .badge{margin-bottom:5px}
#geometry-note{padding:14px 16px;background:var(--hypothesis-soft);color:var(--fg);font-size:12px;line-height:1.55}
#comparison-switch{display:flex;gap:6px;margin-bottom:12px}.comparison-choice{min-height:44px;border:1px solid var(--border);background:var(--surface);border-radius:4px;padding:8px 12px;font-size:12px}.comparison-choice[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.journey-player{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:4px;background:var(--surface);padding:14px 16px;margin-bottom:12px}.path-top{display:flex;justify-content:space-between;align-items:center;gap:18px}.path-intro{display:grid;gap:6px;min-width:0}.path-intro strong{font-weight:600;font-size:13px;line-height:1.5}.path-intro small{color:var(--muted);font-size:11px}.path-actions{display:flex;gap:5px;flex-shrink:0}.path-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}.path-primary:hover{background:var(--accent-hover);color:var(--accent-on)}.path-caption,.path-motion{font-size:12px;line-height:1.6;margin:10px 0 0}.path-caption:empty,.path-motion:empty{display:none}.path-motion{color:var(--muted)}.path-choices{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.path-choice{flex:1 1 280px;min-height:44px;text-align:left;padding:12px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface-raised);font-size:13px;line-height:1.55;overflow-wrap:anywhere}.path-choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.appearance{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.appearance .theme-switch+.theme-switch{border-left:1px solid var(--border);padding-left:14px}
[data-design="classic"] .shell{max-width:1920px}
[data-design="classic"] .brand{font-weight:750;letter-spacing:.07em}
[data-design="classic"] .mark{width:30px;height:30px;border:1px solid var(--accent);border-radius:50%}
[data-design="classic"] .mark:before,[data-design="classic"] .mark:after{border:1px solid var(--accent);border-radius:50%;width:15px;height:15px;top:6px;left:3px;transform:none;background:transparent}
[data-design="classic"] .mark:after{left:10px}
[data-design="classic"] h1{font-weight:600;letter-spacing:-.035em}
[data-design="classic"] .tabs{background:var(--surface-inset);padding:5px;border-radius:10px}
[data-design="classic"] .tab{border:0;border-radius:7px}
[data-design="classic"] .tab[aria-selected=true]{background:var(--selected);color:var(--selected-on);box-shadow:0 2px 4px #203a3414}
[data-design="classic"] .tool{border-radius:7px}

@media(max-width:640px){.shell{padding:0 12px}.masthead{height:auto;min-height:60px;flex-wrap:wrap;gap:4px;padding:8px 0}.brand{font-size:11px}.theme-switch button{padding:8px}.header{display:block;padding:18px 0}.actor{margin-top:16px;max-width:none;min-width:0}.tabs{width:100%;overflow:auto}.tab{padding:8px 10px}.tab span{display:none}.tools{gap:4px}.viewport{padding:8px;max-height:70vh}.boardhead{padding:12px}.path-actions .tool{padding:8px}.drawer{right:8px;top:8px;bottom:8px;max-width:calc(100vw - 16px)}.footer{display:block}.signature{margin-top:8px!important}}

</style>

<body>
<div class="shell">
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true"></span>CX IMPACT</div><div class="appearance"><div class="theme-switch" role="group" aria-label="Дизайн" data-i18n-aria="Дизайн"><button data-design-choice="classic" data-i18n="Классическая">Классическая</button><button data-design-choice="graphite">Graphite</button></div><div class="theme-switch" role="group" aria-label="Цветовой режим" data-i18n-aria="Цветовой режим"><button data-theme-choice="light" data-i18n="Светлая">Светлая</button><button data-theme-choice="dark" data-i18n="Тёмная">Тёмная</button><button data-theme-choice="system" data-i18n="Системная">Системная</button></div></div></header>
<section class="header"><div><p class="eyebrow" id="map-mode"></p><div id="comparison-switch" hidden></div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><p class="subtitle scope" id="scope"></p></div><div class="actor"><small data-i18n="Для кого строим карту">Для кого строим карту</small><p><strong id="actor"></strong></p><p class="goal" id="goal"></p></div></section>

  $('path-reset').onclick=resetWalk;
  reducedMotion.addEventListener('change',()=>{pauseWalk();updateWalk();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseWalk();updateWalk();}});
}

const themePreference=window.matchMedia('(prefers-color-scheme: dark)');
let themeChoice='system',designChoice='classic';
try{const saved=localStorage.getItem('cx-impact-theme');if(['light','dark','system'].includes(saved))themeChoice=saved;}catch{}
try{const saved=localStorage.getItem('cx-impact-design');if(['classic','graphite'].includes(saved))designChoice=saved;}catch{}
function resolvedTheme(){return themeChoice==='system'?(themePreference.matches?'dark':'light'):themeChoice;}
function readTheme(){
  const css=getComputedStyle(document.documentElement);
  font=css.getPropertyValue('--font-body').trim()||font;
  const roles={surface:'surface',raised:'surface-raised',subtle:'surface-subtle',text:'fg',muted:'muted',border:'border',strong:'border-strong',accent:'accent',accentSoft:'accent-soft',focus:'focus',risk:'danger',riskSoft:'danger-soft',proposal:'proposal',proposalSoft:'proposal-soft',evidence:'evidence',hypothesis:'hypothesis',hypothesisSoft:'hypothesis-soft',unknown:'unknown',unknownSoft:'unknown-soft'};
  const fallback={surface:'#fffefa',raised:'#ffffff',subtle:'#f1f4ed',text:'#263e35',muted:'#667e6d',border:'#dce5d8',strong:'#98ac9a',accent:'#24695a',accentSoft:'#e4eee5',focus:'#b18d34',risk:'#7c4e3d',riskSoft:'#f8eee7',proposal:'#4c67a0',proposalSoft:'#edf1f8',evidence:'#276756',hypothesis:'#a06a24',hypothesisSoft:'#f5edda',unknown:'#667e6d',unknownSoft:'#f1f4ed'};
  colors=Object.fromEntries(Object.entries(roles).map(([key,name])=>[key,css.getPropertyValue('--'+name).trim()||fallback[key]]));
  for(const [key,name]of Object.entries({cellEven:'cell-even',cellOdd:'cell-odd',stage:'stage',outcome:'outcome'}))colors[key]=css.getPropertyValue('--'+name).trim()||colors.surface;
  palette={observed:colors.evidence,declared:colors.evidence,requirement:colors.evidence,user_fact:colors.evidence,code:colors.evidence,hypothesis:colors.hypothesis,unknown:colors.unknown,proposal:colors.proposal};
  if(designChoice==='classic'&&resolvedTheme()==='light')Object.assign(palette,{declared:'#52685d',requirement:'#24695a',user_fact:'#596c2f',code:'#526c80'});
  edgeStyles=Object.fromEntries(Object.entries(Core.edgeStyles).map(([kind,style])=>[kind,{...style,color:css.getPropertyValue('--edge-'+(kind==='exception'?'recovery':kind)).trim()||style.color}]));
}
function applyTheme(redraw=true){
  document.documentElement.dataset.theme=resolvedTheme();
  document.documentElement.dataset.design=designChoice;
  for(const b of document.querySelectorAll('[data-design-choice]'))b.setAttribute('aria-pressed',String(b.dataset.designChoice===designChoice));
  for(const b of document.querySelectorAll('[data-theme-choice]'))b.setAttribute('aria-pressed',String(b.dataset.themeChoice===themeChoice));
  if(redraw){const vp=$('viewport'),left=vp.scrollLeft,top=vp.scrollTop;render();vp.scrollTo(left,top);}
}
function initTheme(){
  applyTheme(false);
  for(const b of document.querySelectorAll('[data-theme-choice]'))b.onclick=()=>{themeChoice=b.dataset.themeChoice;try{localStorage.setItem('cx-impact-theme',themeChoice);}catch{}applyTheme();};
  for(const b of document.querySelectorAll('[data-design-choice]'))b.onclick=()=>{designChoice=b.dataset.designChoice;try{localStorage.setItem('cx-impact-design',designChoice);}catch{}applyTheme();};
  themePreference.addEventListener('change',()=>{if(themeChoice==='system')applyTheme();});
}

initTheme();
initWalk();
render();
</script>
</body></html>
